services:
    # ================================
    # JELLYFIN
    # ================================
    jellyfin:
        image: lscr.io/linuxserver/jellyfin:latest
        container_name: jellyfin
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/jellyfin/config:/config
            - /data/media/movies:/movies
            - /data/media/TV:/tv
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.sqrd.link`)"
            - "traefik.http.routers.jellyfin.entrypoints=websecure"
            - "traefik.http.routers.jellyfin.tls=true"
            - "traefik.http.routers.jellyfin.tls.certresolver=cf"
            - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
        networks:
            - proxy

    # ================================
    # QBITTORRENT
    # ================================
    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        container_name: qbittorrent
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
            - WEBUI_PORT=8088
        volumes:
            - /srv/docker/volumes/qbittorrent/config:/config
            - /data/media/downloads:/downloads
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.sqrd.link`)"
            - "traefik.http.routers.qbittorrent.entrypoints=websecure"
            - "traefik.http.routers.qbittorrent.tls=true"
            - "traefik.http.routers.qbittorrent.tls.certresolver=cf"
            - "traefik.http.services.qbittorrent.loadbalancer.server.port=8088"
        networks:
            - proxy
    # ================================
    # RECYCLARR
    # ================================
    recyclarr:
      image: ghcr.io/recyclarr/recyclarr:8
      container_name: recyclarr
      user: "3001:3001" # Matches your PUID/PGID for the rest of the arr stack
      volumes:
        - /srv/docker/volumes/recyclarr/config:/config
      environment:
        - TZ=Europe/Amsterdam
        # Pass API keys via the local .env file
        - RADARR_API_KEY=${RADARR_API_KEY}
        - SONARR_API_KEY=${SONARR_API_KEY}
      restart: unless-stopped
      networks:
        - proxy
    # ================================
    # SONARR
    # ================================
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: sonarr
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/sonarr/config:/config
            - /data/media/TV:/tv
            - /data/media/downloads:/downloads
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.sonarr.rule=Host(`sonarr.sqrd.link`)"
            - "traefik.http.routers.sonarr.entrypoints=websecure"
            - "traefik.http.routers.sonarr.tls=true"
            - "traefik.http.routers.sonarr.tls.certresolver=cf"
            - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
        networks:
            - proxy

    # ================================
    # RADARR
    # ================================
    radarr:
        image: lscr.io/linuxserver/radarr:latest
        container_name: radarr
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/radarr/config:/config
            - /data/media/movies:/movies
            - /data/media/downloads:/downloads
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.radarr.rule=Host(`radarr.sqrd.link`)"
            - "traefik.http.routers.radarr.entrypoints=websecure"
            - "traefik.http.routers.radarr.tls=true"
            - "traefik.http.routers.radarr.tls.certresolver=cf"
            - "traefik.http.services.radarr.loadbalancer.server.port=7878"
        networks:
            - proxy

    # ================================
    # LIDARR
    # ================================
    lidarr:
        image: lscr.io/linuxserver/lidarr:latest
        container_name: lidarr
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/lidarr/config:/config
            - /data/media/music:/music
            - /data/media/downloads:/downloads
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.lidarr.rule=Host(`lidarr.sqrd.link`)"
            - "traefik.http.routers.lidarr.entrypoints=websecure"
            - "traefik.http.routers.lidarr.tls=true"
            - "traefik.http.routers.lidarr.tls.certresolver=cf"
            - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
        networks:
            - proxy

    # ================================
    # BAZARR
    # ================================
    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        container_name: bazarr
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/bazarr/config:/config
            - /data/media/movies:/movies
            - /data/media/TV:/tv
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.bazarr.rule=Host(`bazarr.sqrd.link`)"
            - "traefik.http.routers.bazarr.entrypoints=websecure"
            - "traefik.http.routers.bazarr.tls=true"
            - "traefik.http.routers.bazarr.tls.certresolver=cf"
            - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
        networks:
            - proxy

    # ================================
    # PROWLARR
    # ================================
    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        container_name: prowlarr
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/prowlarr/config:/config
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.sqrd.link`)"
            - "traefik.http.routers.prowlarr.entrypoints=websecure"
            - "traefik.http.routers.prowlarr.tls=true"
            - "traefik.http.routers.prowlarr.tls.certresolver=cf"
            - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
        networks:
            - proxy

    # ================================
    # FLARESOLVERR
    # ================================
    flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        container_name: flaresolverr
        restart: unless-stopped
        environment:
            - LOG_LEVEL=info
            - TZ=Europe/Amsterdam
        networks:
            - proxy

    # ================================
    # SEERR
    # ================================
    seerr:
        image: ghcr.io/seerr-team/seerr:latest
        container_name: seerr
        init: true
        restart: unless-stopped
        environment:
            - LOG_LEVEL=debug
            - TZ=Europe/Amsterdam
            - PORT=5055
        volumes:
            - /srv/docker/volumes/seerr/config:/app/config
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.seerr.rule=Host(`seer.sqrd.link`) || Host(`verzoekjes.sqrd.link`)"
            - "traefik.http.routers.seerr.entrypoints=websecure"
            - "traefik.http.routers.seerr.tls=true"
            - "traefik.http.routers.seerr.tls.certresolver=cf"
            - "traefik.http.services.seerr.loadbalancer.server.port=5055"
        networks:
            - proxy

    # ================================
    # SABNZBD
    # ================================
    sabnzbd:
        image: lscr.io/linuxserver/sabnzbd:latest
        container_name: sabnzbd
        restart: unless-stopped
        environment:
            - PUID=3001
            - PGID=3001
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/sabnzbd/config:/config
            - /data/media/downloads:/downloads
            - /data/media/tempdl:/tempdl
            - /data/media/get:/get
            - /data/media/movies:/movies
            - /data/media/TV:/tv
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.sqrd.link`)"
            - "traefik.http.routers.sabnzbd.entrypoints=websecure"
            - "traefik.http.routers.sabnzbd.tls=true"
            - "traefik.http.routers.sabnzbd.tls.certresolver=cf"
            - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"
        networks:
            - proxy

    # ================================
    # SPOTTARR - Spotnet Newznab Indexer
    # ================================
    spottarr:
        image: ghcr.io/spottarr/spottarr:latest
        container_name: spottarr
        user: "3001:3001"
        environment:
            - TZ=Europe/Amsterdam
            - USENET__HOSTNAME=${SPOTTARR_USENET_HOST}
            - USENET__USERNAME=${SPOTTARR_USENET_USER}
            - USENET__PASSWORD=${SPOTTARR_USENET_PASS}
            - USENET__PORT=${SPOTTARR_USENET_PORT:-563}
            - USENET__USETLS=${SPOTTARR_USENET_TLS:-true}
            - USENET__MAXCONNECTIONS=${SPOTTARR_USENET_CONNECTIONS:-5}
            - SPOTNET__RETRIEVEAFTER=2026-01-01T00:00:00Z
            - NEWZNAB__APIKEY=${SPOTTARR_API_KEY}
        volumes:
            - /srv/docker/volumes/spottarr/data:/data
        restart: unless-stopped
        networks:
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.spottarr.rule=Host(`spottarr.sqrd.link`)"
            - "traefik.http.routers.spottarr.entrypoints=websecure"
            - "traefik.http.routers.spottarr.tls=true"
            - "traefik.http.routers.spottarr.tls.certresolver=cf"
            - "traefik.http.services.spottarr.loadbalancer.server.port=8383"

    # ================================
    # SPOTWEB & DB
    # ================================
    spotweb-db:
        image: mariadb:10.11
        container_name: spotweb-db
        restart: unless-stopped
        environment:
            - MYSQL_ROOT_PASSWORD=${SPOTWEB_DB_ROOT_PASS}
            - MYSQL_DATABASE=spotweb
            - MYSQL_USER=spotweb
            - MYSQL_PASSWORD=${SPOTWEB_DB_PASS}
            - TZ=Europe/Amsterdam
        volumes:
            - /srv/docker/volumes/spotweb/db:/var/lib/mysql
        networks:
            proxy:
                aliases:
                    - mysql

    spotweb:
        image: erikdevries/spotweb:latest
        container_name: spotweb
        restart: unless-stopped
        depends_on:
            - spotweb-db
        environment:
            - TZ=Europe/Amsterdam
            - DB_ENGINE=pdo_mysql
            - DB_HOST=spotweb-db
            - DB_PORT=3306
            - DB_NAME=spotweb
            - DB_USER=spotweb
            - DB_PASS=${SPOTWEB_DB_PASS}
            - SPOTWEB_DB_TYPE=pdo_mysql
            - SPOTWEB_DB_HOST=spotweb-db
            - SPOTWEB_DB_PORT=3306
            - SPOTWEB_DB_NAME=spotweb
            - SPOTWEB_DB_USER=spotweb
            - SPOTWEB_DB_PASS=${SPOTWEB_DB_PASS}
        volumes:
            - /srv/docker/volumes/spotweb/config:/config
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.spotweb.rule=Host(`spotweb.sqrd.link`)"
            - "traefik.http.routers.spotweb.entrypoints=websecure"
            - "traefik.http.routers.spotweb.tls=true"
            - "traefik.http.routers.spotweb.tls.certresolver=cf"
            - "traefik.http.services.spotweb.loadbalancer.server.port=80"
        networks:
            - proxy
    # ================================
    # watchtower
    # ================================

    watchtower:
        image: containrrr/watchtower
        container_name: watchtower
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        environment:
          - WATCHTOWER_CLEANUP=true
          - WATCHTOWER_POLL_INTERVAL=86400 # Check every 24 hours (in seconds)
        restart: unless-stopped

networks:
    proxy:
        external: true
