:root{
  --paper:#efe2c3; --paper-2:#e2cfa6; --paper-edge:#c9ad7c;
  --ink:#43301e; --ink-2:#6d5134; --ink-3:#9a7d57;
  --sang:#a3452a; --sang-2:#c2704f;
  --wash-green:#b7b487; --wash-rose:#d8a286; --wash-blue:#9fb2b0;
  --serif:"IM Fell English", "Iowan Old Style", Palatino, Georgia, serif;
  --caps:"IM Fell English SC", "IM Fell English", Palatino, Georgia, serif;
  --hand:"Homemade Apple", "Segoe Script", cursive;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2118;color:var(--ink);font-family:var(--serif)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;
  background:radial-gradient(ellipse at 50% 40%,#3a2c1f 0%,#1d1611 100%)}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}

/* ---------- ink ---------- */
.ink{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ink.thin{stroke-width:.8}
.ink.hair{stroke-width:.5;stroke:var(--ink-2)}
.ink.bold{stroke-width:2.4}
.ghost{opacity:.33}
.sang{stroke:var(--sang)}
.fill-paper{fill:var(--paper)}
.rough{filter:url(#rough)}

text{fill:var(--ink);font-family:var(--serif)}
.t-caps{font-family:var(--caps);letter-spacing:.08em}
.t-it{font-style:italic}
.t-hand{font-family:var(--hand)}
.t-sang{fill:var(--sang)}
.t-soft{fill:var(--ink-2)}
.halo{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.mirror{opacity:.42}

/* ---------- interactive ---------- */
.bldg,.ward-hit,.gear,.globe-hit{cursor:pointer}
.bldg:hover .b-shape, .bldg.sel .b-shape{stroke:var(--sang)}
.bldg.sel .b-name{fill:var(--sang)}
.ward-hit{fill:transparent}
.ward-hit:hover{fill:rgba(163,69,42,.05)}
.ward-hit.sel{fill:rgba(163,69,42,.08)}
.gear .gear-body{transition:transform .9s cubic-bezier(.3,.7,.3,1);transform-box:fill-box;transform-origin:center}
.gear:hover .gear-body,.gear.sel .gear-body{transform:rotate(30deg)}
.gear.sel .gear-label{fill:var(--sang)}

#map.focus .dimmable{opacity:.45;transition:opacity .3s}
.dimmable{transition:opacity .3s}

.flow{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flow.permit{stroke:var(--sang);stroke-width:3.2}
.flow.permit-casing{stroke:var(--paper);stroke-width:7;opacity:.85}
.flow.partial{stroke-dasharray:14 6}
.flow.unknown{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:2 7;opacity:.8}
.flow.draw{animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.mark-deny path{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}
.mark-deny circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.mark-q text{font-family:var(--caps);fill:var(--ink-2)}

.layer-off{display:none}

/* ---------- UI chrome ---------- */
#tools{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:5}
.seal-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.seal,.quill{font-family:var(--caps);font-size:14px;letter-spacing:.06em;color:var(--ink);background:var(--paper);
  border:1px solid var(--ink-2);border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.seal[aria-pressed="true"]{background:var(--sang);color:#f6ead0;border-color:#6e2a17}
.quill{border-radius:3px;background:#f3e8cf}
.seal:focus-visible,.quill:focus-visible{outline:2px solid var(--sang);outline-offset:2px}

#folio{position:fixed;top:92px;right:14px;width:min(380px,calc(100vw - 28px));max-height:calc(100vh - 110px);overflow:auto;z-index:6;
  background:linear-gradient(180deg,#f3e7cc,#e9d9b5);border:1px solid var(--ink-3);padding:22px 22px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 40px rgba(120,80,30,.18);font-size:16px;line-height:1.45}
#folio h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;margin:0 0 2px}
#folio .art{font-family:var(--caps);color:var(--sang);letter-spacing:.1em;font-size:14px;margin:0 0 10px}
#folio .lede{font-style:italic;color:var(--ink-2);margin:0 0 12px}
#folio dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 12px}
#folio dt{font-family:var(--caps);font-size:13px;color:var(--ink-2);letter-spacing:.05em;padding-top:2px}
#folio dd{margin:0}
#folio h3{font-family:var(--caps);font-weight:400;font-size:14px;letter-spacing:.1em;color:var(--ink-2);margin:14px 0 4px;border-bottom:1px solid var(--ink-3)}
#folio ul{margin:0;padding-left:18px}
#folio li{margin:2px 0}
#folio code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
#folio .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#folio label{display:flex;flex-direction:column;font-family:var(--caps);font-size:13px;color:var(--ink-2);margin:0 0 10px;gap:3px}
#folio select,#folio input{font-family:var(--serif);font-size:16px;padding:5px 6px;background:#fbf4e3;border:1px solid var(--ink-3);color:var(--ink)}
#folio-close{position:absolute;top:6px;right:10px;background:none;border:0;font-size:26px;color:var(--ink-2);cursor:pointer}
.verdict{font-family:var(--caps);font-size:20px;letter-spacing:.08em;margin:6px 0}
.verdict.permit{color:var(--sang)} .verdict.deny{color:var(--ink)} .verdict.unknown,.verdict.local{color:var(--ink-2)}
.pill{display:inline-block;font-family:var(--caps);font-size:12px;border:1px solid var(--ink-3);border-radius:999px;padding:0 7px;margin:0 4px 2px 0}
.pill.warn{border-color:var(--sang);color:var(--sang)}

@media (max-width:720px){
  #tools{top:auto;bottom:10px;right:10px;left:10px;align-items:stretch}
  .seal-row{justify-content:center}
  #folio{top:auto;bottom:100px;right:10px;left:10px;width:auto;max-height:55vh}
}
@media print{
  #tools,#folio{display:none!important}
  html,body,#stage{background:#fff}
}
#folio a{color:var(--sang);text-decoration-thickness:1px;text-underline-offset:2px}

</style>
</head>
<body>
<main id="stage" aria-label="Network map">
  <svg id="map" viewBox="0 0 2400 1700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title">
    <title id="map-title">Pianta della Rete</title>
  </svg>
</main>

<nav id="tools" aria-label="Map controls">
  <div class="seal-row">
    <button class="seal" data-layer="acl" aria-pressed="true" title="ACL roads and walls">Vie</button>
    <button class="seal" data-layer="tailscale" aria-pressed="true" title="Tailscale tunnel">Filo</button>
    <button class="seal" data-layer="dns" aria-pressed="false" title="DNS flags">Nomi</button>
    <button class="seal" data-layer="svc" aria-pressed="false" title="Services per host">Opere</button>
    <button class="seal" data-layer="notes" aria-pressed="true" title="Margin notes">Note</button>
  </div>
  <div class="seal-row">
    <button class="quill" id="btn-ask">Può passare?</button>
    <button class="quill" id="btn-reset" title="Reset view and selection">Reset</button>
  </div>
</nav>

<aside id="folio" aria-live="polite" hidden>
  <button id="folio-close" aria-label="Close">×</button>
  <div id="folio-body"></div>
</aside>

<template id="tpl-ask">
  <h2>Può passare?</h2>
  <p class="lede">Can this reach that? The gate reads its rules top to bottom. The first rule that matches decides.</p>
  <label>From <select id="ask-from"></select></label>
  <label>To <select id="ask-to"></select></label>
  <label>Port <input id="ask-port" inputmode="numeric" placeholder="any"></label>

const C = { x: 1180, y: 880 };
const R = 600;                 // city wall radius
const R_PIAZZA = 172;          // ring road around the citadel
const R_B0 = 228, R_B1 = R - 138; // building band
const WALL_T = 14;             // wall thickness

}

}

const sk = (d, cls = 'ink', attr = '') => `<path d="${d}" class="${cls}" ${attr}/><path d="${d}" class="${cls} ghost" transform="translate(1.1 .8)" ${attr}/>`;
const arcD = (r, a0, a1, sweep = 1) => { const p0 = P(r, a0), p1 = P(r, a1); return `M${f(p0[0])} ${f(p0[1])} A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${sweep} ${f(p1[0])} ${f(p1[1])}`; };

function wrap(text, n) {
  const out = []; let line = '';
  for (const w of String(text).split(/\s+/)) {

// ------------------------------------------------------------------ model
const ip2n = ip => ip.split('.').reduce((a, b) => a * 256 + (+b), 0);
function inSubnet(ip, cidr) {

function buildModel(policy, inv) {

    const rest = inW.filter(h => !h.public).sort((x, y) => (KIND_ORDER[x.kind] ?? 9) - (KIND_ORDER[y.kind] ?? 9) || x.id.localeCompare(y.id));

    pub.forEach((h, i) => { h.a = w.gateA - i * 12; h.r = R_B1 + 5; });

    placeInWard(w, rest, pub.map(h => ({ r: h.r, a: h.a })));
  }

}

function placeInWard(w, items, blocked) {
  if (!items.length) return;
  const margin = 9, usable = w.span - 2 * margin;
  if (items.length === 1 && items[0].kind === 'clients') { const h = items[0]; h.a = w.ac; h.r = (R_B0 + R_B1) / 2 + 20; return; }

  for (let r = R_B1; r >= R_B0; r -= 62, ring++) {

  // 2. farthest-point sampling: first slot on the middle of the outer street, then always the emptiest spot
  const chosen = [];
  const first = pool.filter(c => c.r === R_B1).sort((x, y) => Math.abs(x.a - w.ac) - Math.abs(y.a - w.ac))[0] || pool[0];
  if (!first) return;
  chosen.push(first);
  while (chosen.length < items.length && chosen.length < pool.length) {
    let best = null, bd = -1;
    for (const c of pool) { if (chosen.includes(c)) continue; const d = Math.min(...chosen.map(x => dist(x, c))); if (d > bd) { bd = d; best = c; } }
    chosen.push(best);
  }
  // overflow (more hosts than streets): squeeze onto the inner ring
  const ov = rng("overflow-" + w.id);
  while (chosen.length < items.length) chosen.push({ r: R_B0, a: w.a0 + margin + usable * ov() });

  const byA = [...chosen].sort((x, y) => x.a - y.a);
  const free = new Set(chosen);
  const takeLast = () => { const s = byA.filter(x => free.has(x)).pop(); free.delete(s); return s; };
  const takeFirst = () => { const s = byA.filter(x => free.has(x))[0]; free.delete(s); return s; };

  for (const h of items) {
    if (h.lean && h.lean === w.cw) Object.assign(h, takeLast());
    else if (h.lean && h.lean === w.ccw) Object.assign(h, takeFirst());
    else plain.push(h);
  }
  const rest = [...free].sort((x, y) => y.r - x.r || x.a - y.a);
  plain.forEach((h, i) => Object.assign(h, rest[i]));
}

// ------------------------------------------------------------------ ACL evaluation
function tokensOf(m, e) {
  if (e.type === 'vlan') return ['vlan:' + e.id];

    for (const o of [-1, 1]) { const t = P(R - WALL_T / 2, gA + o * (gap + 1.8)); s += `<rect x="${f(t[0] - 13)}" y="${f(t[1] - 13)}" width="26" height="26" class="fill-paper" transform="rotate(${f(gA)} ${f(t[0])} ${f(t[1])})"/><rect x="${f(t[0] - 13)}" y="${f(t[1] - 13)}" width="26" height="26" fill="url(#hx)" class="ink" transform="rotate(${f(gA)} ${f(t[0])} ${f(t[1])})"/>`; }
    s += sk(M([P(R - 6, gA - gap * .55), g3]) + M([P(R - 6, gA + gap * .55), g2]), 'ink');
    for (let i = 1; i < 5; i++) { const rr = R + i * 9; s += `<path d="${M([P(rr, gA - gap * .55), P(rr, gA + gap * .55)])}" class="ink thin"/>`; }

// ------------------------------------------------------------------ buildings
const RADIUS = { hypervisor: 58, nas: 48, vm: 44, lxc: 36, container: 30, switch: 26, ap: 24, device: 24, clients: 66 };
function glyph(h) {

  if (k === 'hypervisor') {

    const W2 = 128, H2 = 80, cw = 62, ch = 30;
    const outer = M([[-W2 / 2, -H2 / 2], [W2 / 2, -H2 / 2], [W2 / 2, H2 / 2], [-W2 / 2, H2 / 2]]) + 'Z', hole = M([[-cw / 2, -ch / 2], [-cw / 2, ch / 2], [cw / 2, ch / 2], [cw / 2, -ch / 2]]) + 'Z';
    let s = `<path d="${outer}${hole}" class="fill-paper" fill-rule="evenodd"/><path d="${outer}${hole}" fill="url(#h45)" fill-rule="evenodd"/>` + sk(outer, 'ink b-shape') + sk(hole, 'ink thin b-shape');

    for (let i = -2; i <= 2; i++) s += `<circle cx="${i * 11}" cy="0" r="1.6" fill="var(--ink)"/>`;
    return s;
  }
  if (k === 'nas') {

    let s = `<circle r="46" class="fill-paper"/><circle r="46" fill="url(#h135)"/>` + sk(circleD([0, 0], 46, r), 'ink b-shape') + `<circle r="26" class="fill-paper"/>` + sk(circleD([0, 0], 26, r), 'ink thin');
    for (let i = 0; i < 12; i++) { const a = rad(i * 30); s += `<path d="M${f(26 * Math.sin(a))} ${f(-26 * Math.cos(a))} L${f(46 * Math.sin(a))} ${f(-46 * Math.cos(a))}" class="ink hair"/>`; }
    s += sk(circleD([0, 0], 9, r), 'ink thin') + `<circle r="9" fill="url(#hx)"/>`;
    return s;
  }
  if (k === 'vm') {
    const w = 100, hh = 56, i = 20;
    return rect(w, hh, 'h45') + sk(M([[-w / 2, -hh / 2], [-w / 2 + i, 0], [w / 2 - i, 0], [w / 2, -hh / 2]]) + M([[-w / 2, hh / 2], [-w / 2 + i, 0]]) + M([[w / 2, hh / 2], [w / 2 - i, 0]]), 'ink thin');
  }

    let s = `<circle r="15" class="fill-paper"/><circle r="15" fill="url(#h45)"/>` + sk(circleD([0, 0], 15, r), 'ink b-shape');
    for (const q of [24, 32]) for (const sgn of [-1, 1]) s += `<path d="M${sgn * q * .64} ${-q * .77} A${q} ${q} 0 0 ${sgn > 0 ? 1 : 0} ${sgn * q * .64} ${q * .77}" class="ink thin sang" opacity=".8"/>`;
    return s;
  }
  if (k === 'clients') {
    const n = Math.max(5, Math.min(13, h.count || 8));
    let s = '';
    for (let i = 0; i < n; i++) {
      const a = r() * Math.PI * 2, d = 12 + r() * 46, x = Math.cos(a) * d, y = Math.sin(a) * d * .8, rot = (r() - .5) * 60;
      const w = 16 + r() * 10, hh = 11 + r() * 5;
      const p = M([[-w / 2, -hh / 2], [w / 2, -hh / 2], [w / 2, hh / 2], [-w / 2, hh / 2]]) + 'Z';
      s += `<g transform="translate(${f(x)} ${f(y)}) rotate(${f(rot)})"><path d="${p}" class="fill-paper"/><path d="${p}" fill="url(#h45)"/>${sk(p, 'ink thin b-shape')}</g>`;

function tower(h) {

function anchor(m, e) {

  if (vlanOf(m, s) === vlanOf(m, d)) { const c = P((A.r + B.r) / 2 * .85, (A.a + B.a) / 2); return `M${f(A.p[0])} ${f(A.p[1])} Q${f(c[0])} ${f(c[1])} ${f(B.p[0])} ${f(B.p[1])}`; }

      s += `<g class="mark-deny"><circle cx="${f(B[0])}" cy="${f(B[1] - 2)}" r="15"/><path d="M${f(B[0] - 8)} ${f(B[1] - 10)} L${f(B[0] + 8)} ${f(B[1] + 6)} M${f(B[0] + 8)} ${f(B[1] - 10)} L${f(B[0] - 8)} ${f(B[1] + 6)}"/></g>`;
    } else {
      s += `<path d="${d}" class="flow unknown"/><g class="mark-q"><circle cx="${f(B[0])}" cy="${f(B[1])}" r="12" fill="var(--paper)" stroke="var(--ink-2)"/><text x="${f(B[0])}" y="${f(B[1] + 6)}" text-anchor="middle" font-size="17">?</text></g>`;
    }
  }
  g.innerHTML = s;
  g.querySelectorAll('.flow.draw').forEach(p => { const L = p.getTotalLength(); p.style.setProperty('--len', L); p.style.strokeDasharray = p.classList.contains('partial') ? '' : L; if (!p.classList.contains('partial')) p.style.strokeDashoffset = 0; });
}
function targetsFor(m, src) {
  const out = [];
  for (const h of m.hosts) if (!(src.type === 'host' && h.id === src.id)) out.push({ type: 'host', id: h.id });
  return out;
}

// ------------------------------------------------------------------ app
const state = { m: null, sel: null, layers: { acl: true, tailscale: true, dns: false, svc: false, notes: true } };

async function loadData() {
  if (window.MAPPA_DATA) return window.MAPPA_DATA;
  const get = u => fetch(u, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
  const [policy, inventory] = await Promise.all([get('data/policy.json'), get('data/inventory.json')]);
  return { policy, inventory };
}

function render() {
  const m = state.m, svg = document.getElementById('map');
  // order matters: fields, rose, streets, walls, citadel, buildings, outside, margins, flows on top
  const city = wardFields(m) + rose() + moat() + streets(m) + walls(m) + citadel(m) + wardLabels(m) + buildings(m);
  svg.innerHTML = `<title>Pianta della Rete</title>${defs()}${paper()}<g id="city">${city}</g>${world(m)}${tunnel(m)}${title(m)}${mechanism(m)}${legend(m)}${ledger(m)}<g class="layer-notes">${study(m)}</g><g id="flows"></g>`;
  applyLayers();
}
function applyLayers() {
  const svg = document.getElementById('map');
  for (const [k, on] of Object.entries(state.layers)) svg.querySelectorAll('.layer-' + k).forEach(el => el.classList.toggle('layer-off', !on));
  document.querySelectorAll('.seal').forEach(b => b.setAttribute('aria-pressed', String(!!state.layers[b.dataset.layer])));
  if (!state.layers.acl) document.getElementById('flows').innerHTML = '';
}

// ---- folio (detail panel)
const folio = () => document.getElementById('folio');
function openFolio(html) { const f0 = folio(); document.getElementById('folio-body').innerHTML = html; f0.hidden = false; }
function closeFolio() { folio().hidden = true; clearSel(); }
function clearSel() {
  state.sel = null;
  document.querySelectorAll('.sel').forEach(e => e.classList.remove('sel'));
  document.getElementById('map').classList.remove('focus');
  const g = document.getElementById('flows'); if (g) g.innerHTML = '';
}
function rulesMentioning(m, toks) { return (m.policy.acl?.rules || []).filter(r => r.from.concat(r.to).some(t => toks.includes(t))); }
function ruleLi(r) { return `<li><span class="pill ${r.action === 'permit' ? 'warn' : ''}">${esc(r.rules)} ${r.action}</span>${esc(r.note || '')}${r.verified === false ? ' <em>(unverified)</em>' : ''}</li>`; }

function showFrom(src, dir = 'out') {
  const m = state.m;
  if (!state.layers.acl) { state.layers.acl = true; applyLayers(); }
  const pairs = [];
  if (dir === 'out') for (const t of targetsFor(m, src)) pairs.push({ src, dst: t, res: evaluate(m, src, t) });
  else {
    for (const w of m.wards) pairs.push({ src: { type: 'vlan', id: w.id }, dst: src, res: evaluate(m, { type: 'vlan', id: w.id }, src) });
    for (const h of m.hosts) if (h.kind !== 'clients' && !(src.type === 'host' && h.id === src.id)) { const s2 = { type: 'host', id: h.id }, res = evaluate(m, s2, src); if (res.rule && res.rule.from.includes('host:' + h.id)) pairs.push({ src: s2, dst: src, res }); }
    if (src.type === 'host' && src.id === m.pfHost) pairs.push({ src: { type: 'world' }, dst: src, res: { verdict: 'permit' } });
    // for "who reaches me", mark denials at the source instead of the target
    pairs.forEach(p => { if (p.res.verdict === 'deny') { const t = p.dst; p.dst = p.src; p.src = t; } });
  }
  document.getElementById('map').classList.add('focus');
  drawFlows(m, pairs);
  return pairs;
}

function selectHost(id) {
  const m = state.m, h = m.hById[id]; if (!h) return;
  clearSel(); state.sel = { type: 'host', id };
  document.querySelectorAll(`[data-host="${CSS.escape(id)}"]`).forEach(e => e.classList.add('sel'));
  const w = m.wById[h.vlan];
  const toks = tokensOf(m, { type: 'host', id });
  const dns = (m.policy.dns || []).filter(d => d.target && m.norm(short(d.target)) === id);
  const children = m.hosts.filter(x => x.parent === id);
  const pairs = showFrom({ type: 'host', id });
  const ok = pairs.filter(p => p.res.verdict === 'permit').map(p => m.hById[p.dst.id]?.label || p.dst.id);
  openFolio(`<h2>${esc(h.kind === 'clients' ? h.label : h.id)}</h2><p class="art">${esc(w.art)} · ${esc(w.name)} ward</p>
    ${h.note ? `<p class="lede">${esc(h.note)}</p>` : ''}
    <dl>${h.ip ? `<dt>IP</dt><dd><code>${esc(h.ip)}</code>${(h.legacy_ips || []).map(x => ` <span class="pill">legacy ${esc(x)}</span>`).join('')}</dd>` : ''}
    ${h.role ? `<dt>Role</dt><dd>${esc(h.role)}</dd>` : ''}${h.kind ? `<dt>Kind</dt><dd>${esc(h.kind)}</dd>` : ''}
    ${h.model ? `<dt>Model</dt><dd>${esc(h.model)}</dd>` : ''}${h.parent ? `<dt>Lives on</dt><dd><a href="#" data-goto="${esc(h.parent)}">${esc(h.parent)}</a></dd>` : ''}
    ${h.status ? `<dt>Status</dt><dd>${esc(h.status)}</dd>` : ''}${(h.tags || []).length ? `<dt>Tags</dt><dd>${h.tags.map(t => `<span class="pill warn">${esc(t)}</span>`).join('')}</dd>` : ''}
    ${h.count != null ? `<dt>Clients</dt><dd>${h.count}</dd>` : ''}</dl>
    ${(h.services || []).length ? `<h3>Opere · services</h3><p>${h.services.map(esc).join(' · ')}</p>` : ''}
    ${(h.stores || []).length ? `<h3>Stores</h3><p>${h.stores.map(esc).join(' · ')}</p>` : ''}
    ${children.length ? `<h3>Guests it carries</h3><p>${children.map(c => `<a href="#" data-goto="${esc(c.id)}">${esc(c.id)}</a>`).join(' · ')}</p>` : ''}
    ${dns.length ? `<h3>Names pointing here</h3><ul>${dns.map(d => `<li><code>${esc(d.record)}</code> ${esc(d.note || '')}</li>`).join('')}</ul>` : ''}
    <h3>Can reach (red roads)</h3><p>${ok.length ? ok.map(esc).join(' · ') : '<em>nothing beyond its ward</em>'}</p>
    ${rulesMentioning(m, toks).length ? `<h3>Rules that name it</h3><ul>${rulesMentioning(m, toks).map(ruleLi).join('')}</ul>` : ''}
    <div class="row"><button class="quill" data-dir="out">Where can it go</button><button class="quill" data-dir="in">Who reaches it</button></div>`);
}

function selectWard(id) {
  const m = state.m, w = m.wById[id]; if (!w) return;
  clearSel(); state.sel = { type: 'vlan', id };
  document.querySelectorAll(`[data-ward="${CSS.escape(id)}"]`).forEach(e => e.classList.add('sel'));
  const pairs = showFrom({ type: 'vlan', id });
  const ok = pairs.filter(p => p.res.verdict === 'permit').map(p => p.dst.id);
  const deny = pairs.filter(p => p.res.verdict === 'deny').length, unk = pairs.filter(p => p.res.verdict === 'unknown').length;
  openFolio(`<h2>${esc(w.art)}</h2><p class="art">${roman(w.idx + 1)} · ${esc(w.name)} · vlan ${w.vid}</p><p class="lede">${esc(w.purpose || '')}</p>
    <dl><dt>Subnet</dt><dd><code>${esc(w.subnet)}</code></dd><dt>Gateway</dt><dd><code>${esc(w.subnet.replace(/\.0\/\d+$/, m.policy.gateway?.ip_suffix || '.254'))}</code></dd>
    <dt>Tailscale</dt><dd>${w.tailscale ? 'routed' : 'not routed'}</dd><dt>Dwellers</dt><dd>${w.hosts.map(h => `<a href="#" data-goto="${esc(h.id)}">${esc(h.kind === 'clients' ? h.label : h.id)}</a>`).join(' · ') || '<em>none</em>'}</dd></dl>
    <h3>From here the gate allows</h3><p>${ok.length ? ok.map(esc).join(' · ') : '<em>nothing on the LAN</em>'}</p>
    <p><span class="pill">${deny} denied</span><span class="pill">${unk} undocumented</span></p>
    ${rulesMentioning(m, ['vlan:' + id]).length ? `<h3>Rules that name it</h3><ul>${rulesMentioning(m, ['vlan:' + id]).map(ruleLi).join('')}</ul>` : ''}
    <div class="row"><button class="quill" data-dir="out">Where can it go</button><button class="quill" data-dir="in">Who reaches it</button></div>`);
}

function selectRuleGroup(label) {
  const m = state.m; clearSel();
  document.querySelectorAll(`.gear[data-rules="${CSS.escape(label)}"]`).forEach(e => e.classList.add('sel'));
  if (label === '·') { openFolio(`<h2>The default</h2><p class="art">when no rule catches</p><p>${esc(m.policy.acl?.default_note || '')}</p><p class="lede">${esc(m.policy.acl?.source || '')}</p>`); return; }
  const items = (m.policy.acl?.rules || []).filter(r => r.rules === label);
  const toEnt = t => t.startsWith('vlan:') ? { type: 'vlan', id: t.slice(5) } : { type: 'host', id: m.norm(t.slice(5)) };
  const pairs = [];
  for (const r of items) for (const a of r.from) for (const b of r.to) { const s = toEnt(a), d = toEnt(b); if ((s.type === 'vlan' ? m.wById[s.id] : m.hById[s.id]) && (d.type === 'vlan' ? m.wById[d.id] : m.hById[d.id])) pairs.push({ src: s, dst: d, res: { verdict: r.action, partial: !!r.ports && r.action === 'permit' } }); }
  if (!state.layers.acl) { state.layers.acl = true; applyLayers(); }
  document.getElementById('map').classList.add('focus');
  drawFlows(m, pairs);
  openFolio(`<h2>Rule ${esc(label)}</h2><p class="art">${esc(items[0].action)}</p><ul>${items.map(r => `<li><code>${r.from.map(short).map(esc).join(', ')}</code> → <code>${r.to.map(short).map(esc).join(', ')}</code>${r.ports ? ` on <code>${r.ports.join(', ')}</code>` : ''}<br><em>${esc(r.note || '')}</em>${r.verified === false ? ' <span class="pill warn">unverified</span>' : ''}</li>`).join('')}</ul><p class="lede">${esc(m.policy.acl?.source || '')}</p>`);
}

function selectWorld() {
  const m = state.m; clearSel();
  const pairs = m.pfHost ? [{ src: { type: 'world' }, dst: { type: 'host', id: m.pfHost }, res: { verdict: 'permit' } }] : [];
  document.getElementById('map').classList.add('focus'); drawFlows(m, pairs);
  const pf = m.policy.edge?.port_forwards || [];
  openFolio(`<h2>Il Mondo</h2><p class="art">the internet</p><p class="lede">${esc(m.policy.edge?.internet?.note || '')}. No VPS, no tunnel: the ER605 forwards straight in.</p>
    <h3>Port-forwards</h3><ul>${pf.map(p => `<li><code>${esc(short(p.to))}</code>: ${esc(p.ports)}. ${esc(p.note || '')}</li>`).join('')}</ul>
    <h3>Public names</h3><ul>${(m.policy.dns || []).filter(d => d.target?.startsWith('edge:')).map(d => `<li><code>${esc(d.record)}</code> ${esc(d.note || '')}</li>`).join('')}</ul>`);
}

function openAsk() {
  const m = state.m; clearSel();
  openFolio(document.getElementById('tpl-ask').innerHTML);
  const opts = [['world:', 'Il Mondo (internet)']].concat(m.wards.map(w => ['vlan:' + w.id, `${w.art} · ${w.name} (whole ward)`])).concat(m.hosts.filter(h => h.kind !== 'clients').map(h => ['host:' + h.id, h.id + (h.ip ? ' · ' + h.ip : '')]));
  const fill = (sel, skipWorld) => { sel.innerHTML = opts.filter(o => !(skipWorld && o[0] === 'world:')).map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join(''); };
  const fr = document.getElementById('ask-from'), to = document.getElementById('ask-to'), port = document.getElementById('ask-port');
  fill(fr); fill(to, true);
  fr.value = 'vlan:leo'; to.value = 'host:grimoire';
  const parse = v => { const [t, id] = v.split(':'); return t === 'world' ? { type: 'world' } : { type: t, id }; };
  const run = () => {
    const s = parse(fr.value), d = parse(to.value), p = port.value.trim() ? parseInt(port.value, 10) : null;
    const res = evaluate(m, s, d, Number.isFinite(p) ? p : null);
    const word = { permit: 'Passa', deny: 'Non passa', local: 'Nessuna porta', unknown: 'Non è scritto' }[res.verdict] || res.verdict;
    document.getElementById('ask-result').innerHTML = `<p class="verdict ${res.verdict}">${word}</p>
      <p>${res.rule ? `Rule <strong>${esc(res.rule.rules)}</strong> (${esc(res.rule.action)}) catches it first. ${esc(res.rule.note || '')}${res.partial ? ` Only on ports <code>${res.rule.ports.join(', ')}</code>.` : ''}${res.rule.verified === false ? ' <span class="pill warn">unverified rule</span>' : ''}` : esc(res.text || '')}</p>`;
    document.getElementById('map').classList.add('focus');
    drawFlows(m, [{ src: s, dst: d, res }]);
  };
  [fr, to].forEach(e => e.addEventListener('change', run)); port.addEventListener('input', run);
  run();
}

// ---- pan & zoom on the viewBox
const vb = { x: 0, y: 0, w: W, h: H };
function setVB() { document.getElementById('map').setAttribute('viewBox', `${f(vb.x)} ${f(vb.y)} ${f(vb.w)} ${f(vb.h)}`); }
function toSvg(svg, cx, cy) { const r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height), ox = (r.width - vb.w / s) / 2, oy = (r.height - vb.h / s) / 2; return [vb.x + (cx - r.left - ox) * s, vb.y + (cy - r.top - oy) * s, s]; }
function zoomAt(svg, cx, cy, k) {
  const [x, y] = toSvg(svg, cx, cy);
  const nw = Math.min(W * 1.2, Math.max(W / 8, vb.w * k)), kk = nw / vb.w;
  vb.x = x - (x - vb.x) * kk; vb.y = y - (y - vb.y) * kk; vb.w = nw; vb.h = vb.h * kk; setVB();
}
function wirePanZoom(svg) {
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(svg, e.clientX, e.clientY, Math.exp(e.deltaY * .0015)); }, { passive: false });
  const pts = new Map(); let moved = false, last = null, pinch = null;
  svg.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]); moved = false; last = [e.clientX, e.clientY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(svg, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch / d); pinch = d; moved = true; return; }
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    if (!moved && Math.hypot(dx, dy) < 5) return;
    if (!moved) { svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); }
    moved = true;
    const s = toSvg(svg, 0, 0)[2]; vb.x -= dx * s; vb.y -= dy * s; last = [e.clientX, e.clientY]; setVB();
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; svg.classList.remove('dragging'); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('click', e => {
    if (moved) { e.stopPropagation(); moved = false; return; }
    const b = e.target.closest('[data-host]'), w = e.target.closest('[data-ward]'), g = e.target.closest('.gear'), wo = e.target.closest('[data-world]');
    if (b) selectHost(b.dataset.host); else if (g) selectRuleGroup(g.dataset.rules); else if (wo) selectWorld(); else if (w) selectWard(w.dataset.ward); else closeFolio();
  }, true);
  svg.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const b = e.target.closest('[data-host]'), g = e.target.closest('.gear'); if (b) { e.preventDefault(); selectHost(b.dataset.host); } else if (g) { e.preventDefault(); selectRuleGroup(g.dataset.rules); } } });
  svg.addEventListener('dblclick', () => { Object.assign(vb, { x: 0, y: 0, w: W, h: H }); setVB(); });
}

async function main() {
  const svg = document.getElementById('map');
  try {
    const { policy, inventory } = await loadData();
    state.m = buildModel(policy, inventory);
  } catch (err) {
    svg.innerHTML = `<rect width="${W}" height="${H}" fill="#efe2c3"/><text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="40" font-style="italic">The map could not be read: ${esc(err.message)}</text>`;
    console.error(err); return;
  }
  render();
  wirePanZoom(svg);
  document.querySelectorAll('.seal').forEach(b => b.addEventListener('click', () => { state.layers[b.dataset.layer] = !state.layers[b.dataset.layer]; applyLayers(); }));
  document.getElementById('btn-ask').addEventListener('click', openAsk);
  document.getElementById('btn-reset').addEventListener('click', () => { closeFolio(); Object.assign(vb, { x: 0, y: 0, w: W, h: H }); setVB(); });
  document.getElementById('folio-close').addEventListener('click', closeFolio);
  document.getElementById('folio').addEventListener('click', e => {
    const a = e.target.closest('[data-goto]'); if (a) { e.preventDefault(); selectHost(a.dataset.goto); return; }
    const d = e.target.closest('[data-dir]'); if (d && state.sel) showFrom(state.sel, d.dataset.dir);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeFolio(); });
  window.mappa = { state, evaluate: (s, d, p) => evaluate(state.m, s, d, p), rerender: render };
}
main();
})();

</script>
